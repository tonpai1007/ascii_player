name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    defaults:
      run:
        working-directory: ascii-player

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ascii-player/pyproject.toml

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Test
        run: pytest -q
