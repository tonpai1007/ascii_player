name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            python-version: "3.8"
            textual: "5.0.0"
          - name: latest
            python-version: "3.13"
            textual: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Pin minimum Textual
        if: matrix.textual != ''
        run: python -m pip install "textual==${{ matrix.textual }}"
      - name: Smoke test
        run: |
          python -c "import textual, ascii_player.tui; print('textual', textual.__version__)"
          python -m ascii_player --help
